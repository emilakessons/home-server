# Genererade Google-kommandon: ett script per motiv
# Säg t.ex. "Hey Google, aktivera skriv ut en bild på Bamse"

print_coloring_page:
  alias: Skriv ut målarbild
  description: Intern helper – skriv ut på valfritt motiv
  mode: queued
  fields:
    subject:
      name: Motiv
      required: true
      selector:
        text:
  sequence:
    - action: tts.speak
      target:
        entity_id: tts.google_translate_sv_se
      data:
        media_player_entity_id: media_player.vardagsrum_vardagsrum
        message: "Jag skriver ut en bild på {{ subject }}"
    - action: rest_command.print_coloring_page
      data:
        subject: "{{ subject }}"
    - action: notify.persistent_notification
      data:
        title: "Målarbild"
        message: "Skriver ut: {{ subject }}"

print_random_coloring_page:
  alias: Skriv ut slumpad målarbild
  mode: single
  sequence:
    - variables:
        subjects:
          - dinosaurie
          - katt
          - hund
          - traktor
          - prinsessa
          - enhörning
          - brandbil
          - rymdraket
          - paw patrol
          - Bamse
          - batman
        subject: "{{ subjects | random }}"
    - action: script.print_coloring_page
      data:
        subject: "{{ subject }}"

print_bild_paw_patrol:
  alias: Skriv ut en bild på paw patrol
  mode: queued
  sequence:
    - action: script.print_coloring_page
      data:
        subject: "paw patrol"

